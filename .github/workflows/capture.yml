name: Capture Windows Browsers QUIC

on:
  workflow_dispatch:

jobs:
  capture-windows:
    name: Windows QUIC Profile Capture
    runs-on: windows-latest
    steps:
      - name: Install Wireshark and Firefox
        shell: powershell
        run: |
          # Установка tshark и Firefox через Chocolatey
          choco install wireshark -y --params "/AddToPath"
          choco install firefox -y

      - name: Download & Install Yandex Browser
        shell: powershell
        run: |
          $installer = "$env:TEMP\YandexSetup.exe"
          Write-Host "[*] Скачивание Яндекс Браузера..."
          
          # Скачиваем официальным curl.exe с переходом по 302 редиректам
          curl.exe -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" `
            -o $installer `
            "https://browser.yandex.ru/download?os=win&bitness=64&banerid=6302000000"

          Write-Host "[*] Тихая установка Яндекс Браузера..."
          Start-Process -FilePath $installer -ArgumentList "--silent", "--do-not-launch-browser" -Wait
          Start-Sleep -Seconds 10

      - name: Capture QUIC Initial Hex Streams
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files\Wireshark"

          # Ищем путь к Яндекс Браузеру (он может встать в LocalAppData или в Program Files)
          $yandexPaths = @(
              "$env:LOCALAPPDATA\Yandex\YandexBrowser\Application\browser.exe",
              "C:\Program Files (x86)\Yandex\YandexBrowser\Application\browser.exe",
              "C:\Program Files\Yandex\YandexBrowser\Application\browser.exe"
          )
          $yandexExe = $yandexPaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          $browsers = [ordered]@{
              "chrome"  = "C:\Program Files\Google\Chrome\Application\chrome.exe"
              "edge"    = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
              "firefox" = "C:\Program Files\Mozilla Firefox\firefox.exe"
              "yandex"  = $yandexExe
          }

          New-Item -ItemType Directory -Force -Path "./dumps"

          foreach ($name in $browsers.Keys) {
              $exe = $browsers[$name]
              Write-Host "`n==============================================="
              Write-Host "[*] Сбор дампа для: $name"
              Write-Host "Путь: $exe"
              Write-Host "==============================================="

              if (-not $exe -or -not (Test-Path $exe)) {
                  Write-Warning "[-] Исполняемый файл для $name не найден, пропускаем..."
                  continue
              }

              $pcapFile = "$env:TEMP\$name.pcap"
              if (Test-Path $pcapFile) { Remove-Item $pcapFile -Force }

              # 1. Запуск tshark в фоне
              $tsharkJob = Start-Job -ScriptBlock {
                  param($pcap)
                  & "C:\Program Files\Wireshark\tshark.exe" -i 1 -f "udp port 443" `
                    -Y "quic && quic.header_form == 1 && quic.long.packet_type == 0" `
                    -w $pcap
              } -ArgumentList $pcapFile

              Start-Sleep -Seconds 2

              # 2. Запуск браузера с форсированием QUIC Initial
              $targetUrl = "https://ya.ru"
              $profileDir = "$env:TEMP\profile_$name"

              if ($name -eq "firefox") {
                  $process = Start-Process -FilePath $exe -ArgumentList "-headless", "-url", $targetUrl -PassThru
              } else {
                  $args = @(
                      "--headless=new",
                      "--disable-gpu",
                      "--enable-quic",
                      "--quic-version=h3",
                      "--user-data-dir=$profileDir",
                      $targetUrl
                  )
                  $process = Start-Process -FilePath $exe -ArgumentList $args -PassThru
              }

              Start-Sleep -Seconds 7

              # 3. Закрытие браузера и остановка сниффера
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Stop-Job $tsharkJob -ErrorAction SilentlyContinue
              Receive-Job $tsharkJob -ErrorAction SilentlyContinue
              Remove-Job $tsharkJob -Force -ErrorAction SilentlyContinue

              # 4. Извлечение первого Initial пакета в Hex Stream
              if (Test-Path $pcapFile) {
                  $hexStreams = & "C:\Program Files\Wireshark\tshark.exe" -r $pcapFile `
                    -Y "quic && quic.header_form == 1 && quic.long.packet_type == 0" `
                    -T fields -e frame.raw

                  if ($hexStreams) {
                      $firstInitial = ($hexStreams -split "`r?`n")[0].Trim()
                      if ($firstInitial.Length -gt 0) {
                          $outFile = "./dumps/${name}_initial_hex.txt"
                          $firstInitial | Out-File -FilePath $outFile -Encoding ascii
                          Write-Host "[+] УСПЕХ: $name Initial сохранен ($($firstInitial.Length) символов Hex)" -ForegroundColor Green
                          continue
                      }
                  }
              }
              Write-Warning "[-] Не удалось перехватить Initial пакет для $name"
          }

      - name: Upload Windows Browser Dumps
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-dumps
          path: dumps/*.txt
