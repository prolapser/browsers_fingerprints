name: Capture Windows QUIC Profiles

on:
  workflow_dispatch:

jobs:
  capture-windows:
    runs-on: windows-latest
    steps:
      - name: Install Wireshark / TShark & Browsers
        shell: powershell
        run: |
          # 1. Установка Wireshark (с tshark)
          choco install wireshark -y --params "/AddToPath"
          
          # 2. Установка Firefox
          choco install firefox -y

          # 3. Установка Яндекс Браузера через официальный Windows-установщик
          $yandexInstaller = "$env:TEMP\YandexSetup.exe"
          Invoke-WebRequest -Uri "https://browser.yandex.ru/download?banerid=6301000000&statpromo=true" -OutFile $yandexInstaller -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          Start-Process -FilePath $yandexInstaller -ArgumentList "--silent", "--do-not-launch-browser" -Wait

      - name: Run QUIC Capture for all browsers
        shell: powershell
        run: |
          # Добавляем путь к tshark в текущую сессию
          $env:Path += ";C:\Program Files\Wireshark"

          # Словарь браузеров и путей к их .exe на Windows
          $browsers = @{
              "chrome"  = "C:\Program Files\Google\Chrome\Application\chrome.exe"
              "edge"    = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
              "firefox" = "C:\Program Files\Mozilla Firefox\firefox.exe"
              "yandex"  = "$env:LOCALAPPDATA\Yandex\YandexBrowser\Application\browser.exe"
          }

          # Папка для результатов
          New-Item -ItemType Directory -Force -Path "./dumps"

          foreach ($name in $browsers.Keys) {
              $exePath = $browsers[$name]
              Write-Host "`n========================================"
              Write-Host "[*] Снятие дампа для: $name"
              Write-Host "Путь к файлу: $exePath"
              Write-Host "========================================"

              if (-not (Test-Path $exePath)) {
                  Write-Warning "[-] Исполняемый файл $exePath не найден, пропускаем..."
                  continue
              }

              $pcapFile = "$env:TEMP\$name.pcap"
              if (Test-Path $pcapFile) { Remove-Item $pcapFile -Force }

              # 1. Запуск tshark в фоне на физическом интерфейсе
              $tsharkJob = Start-Job -ScriptBlock {
                  param($pcap)
                  & "C:\Program Files\Wireshark\tshark.exe" -i 1 -f "udp port 443" -Y "quic && quic.header_form == 1 && quic.long.packet_type == 0" -w $pcap
              } -ArgumentList $pcapFile

              Start-Sleep -Seconds 2

              # 2. Запуск браузера с флагами принудительного QUIC
              $targetUrl = "https://ya.ru"
              $tempProfile = "$env:TEMP\profile_$name"
              
              if ($name -eq "firefox") {
                  # Для Firefox создаем чистый профиль
                  $process = Start-Process -FilePath $exePath -ArgumentList "-headless", "-url", $targetUrl -PassThru
              } else {
                  # Для Chromium-браузеров (Chrome, Edge, Yandex) форсируем QUIC v1 (h3)
                  $args = @(
                      "--headless=new",
                      "--disable-gpu",
                      "--enable-quic",
                      "--quic-version=h3",
                      "--user-data-dir=$tempProfile",
                      $targetUrl
                  )
                  $process = Start-Process -FilePath $exePath -ArgumentList $args -PassThru
              }

              # Даем браузеру 7 секунд на установление соединения
              Start-Sleep -Seconds 7

              # 3. Закрываем браузер и останавливаем tshark
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Stop-Job $tsharkJob -ErrorAction SilentlyContinue
              Receive-Job $tsharkJob -ErrorAction SilentlyContinue
              Remove-Job $tsharkJob -Force -ErrorAction SilentlyContinue

              # 4. Извлекаем Hex Stream с помощью tshark
              if (Test-Path $pcapFile) {
                  $hexStreams = & "C:\Program Files\Wireshark\tshark.exe" -r $pcapFile -Y "quic && quic.header_form == 1 && quic.long.packet_type == 0" -T fields -e frame.raw
                  
                  if ($hexStreams) {
                      # Берем первую строку пакета Initial
                      $firstInitial = ($hexStreams -split "`r?`n")[0].Trim()
                      if ($firstInitial.Length -gt 0) {
                          $outFile = "./dumps/${name}_initial_hex.txt"
                          $firstInitial | Out-File -FilePath $outFile -Encoding ascii
                          Write-Host "[+] УСПЕХ: $name Initial сохранен ($($firstInitial.Length) байт hex)" -ForegroundColor Green
                          continue
                      }
                  }
              }
              Write-Warning "[-] Не удалось перехватить Initial пакет для $name"
          }

      - name: Upload Windows QUIC Dumps
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-dumps
          path: dumps/*.txt
