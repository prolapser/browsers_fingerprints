name: Capture Windows Browsers QUIC

on:
  workflow_dispatch:

jobs:
  capture-windows:
    name: Windows QUIC Profile Capture
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Install Wireshark and Firefox
        shell: powershell
        run: |
          # Wireshark ставим только ради утилиты tshark (для анализа pcapng)
          choco install wireshark -y
          choco install firefox -y

      - name: Download & Install Yandex Browser
        shell: powershell
        run: |
          $installer = "$env:TEMP\YandexSetup.exe"
          Write-Host "[*] Downloading Yandex Browser..."
          
          curl.exe -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" `
            -o $installer `
            "https://browser.yandex.ru/download?os=win&bitness=64&banerid=6302000000"

          Write-Host "[*] Installing Yandex Browser..."
          Start-Process -FilePath $installer -ArgumentList "--silent", "--do-not-launch-browser" -Wait
          
          # Ожидание появления browser.exe (до 30 сек)
          $timer = 30
          while (-not (Test-Path "$env:LOCALAPPDATA\Yandex\YandexBrowser\Application\browser.exe") -and -not (Test-Path "C:\Program Files\Yandex\YandexBrowser\Application\browser.exe") -and -not (Test-Path "C:\Program Files (x86)\Yandex\YandexBrowser\Application\browser.exe") -and $timer -gt 0) {
              Start-Sleep -Seconds 2
              $timer -= 2
          }

      - name: Run QUIC Capture (via Windows Native PktMon)
        shell: powershell
        run: |
          $pythonScript = @'
          import os, sys, time, subprocess, tempfile

          tshark = r'C:\Program Files\Wireshark\tshark.exe'
          if not os.path.exists(tshark):
              print('[-] Error: tshark not found at:', tshark)
              sys.exit(1)

          local_app = os.environ.get('LOCALAPPDATA', '')
          prog_files = os.environ.get('ProgramFiles', r'C:\Program Files')
          prog_files_x86 = os.environ.get('ProgramFiles(x86)', r'C:\Program Files (x86)')

          yandex_candidates = [
              os.path.join(local_app, 'Yandex', 'YandexBrowser', 'Application', 'browser.exe'),
              os.path.join(prog_files_x86, 'Yandex', 'YandexBrowser', 'Application', 'browser.exe'),
              os.path.join(prog_files, 'Yandex', 'YandexBrowser', 'Application', 'browser.exe')
          ]
          yandex_exe = next((p for p in yandex_candidates if os.path.exists(p)), None)

          browsers = {
              'chrome': os.path.join(prog_files, 'Google', 'Chrome', 'Application', 'chrome.exe'),
              'edge': os.path.join(prog_files_x86, 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
              'firefox': os.path.join(prog_files, 'Mozilla Firefox', 'firefox.exe'),
              'yandex': yandex_exe
          }

          os.makedirs('dumps', exist_ok=True)
          target_url = 'https://ya.ru'
          temp_dir = tempfile.gettempdir()

          for name, exe in browsers.items():
              print(f'\n===============================================')
              print(f'[*] Testing browser: {name}')

              if not exe or not os.path.exists(exe):
                  print(f'[-] {name} executable not found, skipping.')
                  continue

              print(f'Path: {exe}')
              etl_path = os.path.join(temp_dir, f'{name}.etl')
              pcapng_path = os.path.join(temp_dir, f'{name}.pcapng')

              for f in [etl_path, pcapng_path]:
                  if os.path.exists(f):
                      try: os.remove(f)
                      except: pass

              # 1. Настройка встроенного Windows Packet Monitor
              subprocess.run(['pktmon', 'stop'], capture_output=True)
              subprocess.run(['pktmon', 'filter', 'remove'], capture_output=True)
              subprocess.run(['pktmon', 'filter', 'add', '-t', 'UDP', '-p', '443'], capture_output=True)

              # 2. Запуск захвата (пишет полные пакеты --pkt-size 0)
              subprocess.run(['pktmon', 'start', '-c', '--pkt-size', '0', '-f', etl_path], capture_output=True)
              time.sleep(2)

              # 3. Запуск браузера с принудительным HTTP/3 (QUIC)
              profile_dir = os.path.join(temp_dir, f'prof_{name}')
              if name == 'firefox':
                  proc = subprocess.Popen([exe, '-headless', '-url', target_url])
              else:
                  proc = subprocess.Popen([
                      exe,
                      '--headless=new',
                      '--disable-gpu',
                      '--enable-quic',
                      '--quic-version=h3',
                      f'--user-data-dir={profile_dir}',
                      target_url
                  ])

              time.sleep(10)

              # 4. Закрываем браузер и останавливаем запись
              proc.kill()
              subprocess.run(['pktmon', 'stop'], capture_output=True)

              # 5. Конвертируем нативный ETL дамп в стандартный PCAPNG
              subprocess.run(['pktmon', 'etl2pcap', etl_path, '--out', pcapng_path], capture_output=True)

              # 6. Извлекаем Hex Stream с помощью tshark (чтение файла НЕ требует Npcap!)
              if os.path.exists(pcapng_path):
                  cmd = [
                      tshark, '-r', pcapng_path,
                      '-Y', 'quic && quic.header_form == 1 && quic.long.packet_type == 0',
                      '-T', 'fields', '-e', 'frame.raw'
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  lines = [l.strip() for l in res.stdout.strip().splitlines() if l.strip()]
                  if lines:
                      first_initial = lines[0]
                      out_file = os.path.join('dumps', f'{name}_initial_hex.txt')
                      with open(out_file, 'w', encoding='ascii') as f:
                          f.write(first_initial)
                      print(f'[+] SUCCESS: {name} Initial packet captured! Length: {len(first_initial)} hex chars')
                      continue

              print(f'[-] Failed to capture Initial packet for {name}')

          subprocess.run(['pktmon', 'filter', 'remove'], capture_output=True)
          '@

          Set-Content -Path script.py -Value $pythonScript
          python script.py

      - name: Upload Windows Browser Dumps
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-dumps
          path: dumps/*.txt
