name: Capture Windows Browsers QUIC

on:
  workflow_dispatch:

jobs:
  capture-windows:
    name: Windows QUIC Profile Capture
    runs-on: windows-latest
    steps:
      - name: Install Npcap and Wireshark
        shell: powershell
        run: |
          # 1. Установка Npcap (драйвер захвата) - это критически важно
          Write-Host "[*] Установка Npcap..."
          choco install npcap -y
          
          # 2. Установка Wireshark (инструментарий)
          Write-Host "[*] Установка Wireshark..."
          choco install wireshark -y
          
          # 3. Принудительный запуск службы драйвера
          Write-Host "[*] Запуск службы Npcap..."
          net start npcap
          
          # 4. Установка Firefox
          choco install firefox -y

      - name: Download & Install Yandex Browser
        shell: powershell
        run: |
          $installer = "$env:TEMP\YandexSetup.exe"
          curl.exe -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" `
            -o $installer `
            "https://browser.yandex.ru/download?os=win&bitness=64&banerid=6302000000"
          
          Start-Process -FilePath $installer -ArgumentList "--silent", "--do-not-launch-browser" -Wait
          Start-Sleep -Seconds 15

      - name: Run QUIC Capture
        shell: powershell
        run: |
          $pythonScript = @'
          import os, sys, time, subprocess, tempfile

          tshark = r'C:\Program Files\Wireshark\tshark.exe'
          
          # Проверка готовности tshark и Npcap
          try:
              # Пробуем получить список интерфейсов. Если Npcap не работает, это упадет.
              ifaces_out = subprocess.check_output([tshark, '-D'], text=True)
              print('[+] Доступные интерфейсы:\n', ifaces_out)
          except subprocess.CalledProcessError as e:
              print('[-] Ошибка драйвера Npcap. Попытка принудительного перезапуска...')
              subprocess.run(['net', 'stop', 'npcap'], shell=True)
              subprocess.run(['net', 'start', 'npcap'], shell=True)
              ifaces_out = subprocess.check_output([tshark, '-D'], text=True)

          # Выбор интерфейса (обычно это 1-й или тот, где есть Ethernet/Ethernet0)
          chosen_iface = '1'
          for line in ifaces_out.strip().splitlines():
              if 'ethernet' in line.lower() or 'ethernet0' in line.lower():
                  chosen_iface = line.split('.')[0].strip()
                  break
          print(f'[+] Используется интерфейс: {chosen_iface}')

          # Определение путей
          local_app = os.environ.get('LOCALAPPDATA', '')
          prog_files = os.environ.get('ProgramFiles', r'C:\Program Files')
          prog_files_x86 = os.environ.get('ProgramFiles(x86)', r'C:\Program Files (x86)')

          yandex_exe = next((p for p in [
              os.path.join(local_app, 'Yandex', 'YandexBrowser', 'Application', 'browser.exe'),
              os.path.join(prog_files_x86, 'Yandex', 'YandexBrowser', 'Application', 'browser.exe'),
              os.path.join(prog_files, 'Yandex', 'YandexBrowser', 'Application', 'browser.exe')
          ] if os.path.exists(p)), None)

          browsers = {
              'chrome': os.path.join(prog_files, 'Google', 'Chrome', 'Application', 'chrome.exe'),
              'edge': os.path.join(prog_files_x86, 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
              'firefox': os.path.join(prog_files, 'Mozilla Firefox', 'firefox.exe'),
              'yandex': yandex_exe
          }

          os.makedirs('dumps', exist_ok=True)
          target_url = 'https://ya.ru'

          for name, exe in browsers.items():
              if not exe or not os.path.exists(exe):
                  print(f'[-] Пропуск {name}: файл не найден.')
                  continue

              print(f'\n>>> Сбор профиля для: {name}')
              pcap_path = os.path.join(tempfile.gettempdir(), f'{name}.pcap')
              if os.path.exists(pcap_path): os.remove(pcap_path)

              # Запуск сниффера (UDP 443, QUIC Initial)
              sniff = subprocess.Popen([
                  tshark, '-i', chosen_iface,
                  '-f', 'udp port 443',
                  '-Y', 'quic && quic.header_form == 1 && quic.long.packet_type == 0',
                  '-w', pcap_path
              ])
              time.sleep(3)

              # Запуск браузера (Headless)
              if name == 'firefox':
                  proc = subprocess.Popen([exe, '-headless', '-url', target_url])
              else:
                  profile_dir = os.path.join(tempfile.gettempdir(), f'prof_{name}')
                  proc = subprocess.Popen([
                      exe, '--headless=new', '--disable-gpu', '--enable-quic', 
                      '--quic-version=h3', f'--user-data-dir={profile_dir}', target_url
                  ])

              time.sleep(10)
              proc.kill()
              sniff.terminate()
              try: sniff.wait(timeout=5)
              except: sniff.kill()

              # Чтение результата
              if os.path.exists(pcap_path):
                  cmd = [tshark, '-r', pcap_path, '-Y', 'quic && quic.header_form == 1 && quic.long.packet_type == 0', '-T', 'fields', '-e', 'frame.raw']
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  lines = [l.strip() for l in res.stdout.strip().splitlines() if l.strip()]
                  if lines:
                      with open(os.path.join('dumps', f'{name}_initial_hex.txt'), 'w') as f:
                          f.write(lines[0])
                      print(f'[+] УСПЕХ: {name} захвачен ({len(lines[0])} символов)')
                      continue
              print(f'[-] Пакет не пойман для {name}')
          '@
          Set-Content -Path script.py -Value $pythonScript
          python script.py

      - name: Upload Dumps
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-profiles
          path: dumps/*.txt
