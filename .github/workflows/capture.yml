name: Multi-OS QUIC Initial Dumps

on:
  workflow_dispatch:

jobs:
  capture:
    name: ${{ matrix.browser_id }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            browser_id: chrome_linux
          - os: ubuntu-latest
            browser_id: edge_linux
          - os: ubuntu-latest
            browser_id: yandex_linux
          - os: ubuntu-latest
            browser_id: firefox_linux

          # Windows
          - os: windows-latest
            browser_id: chrome_win
          - os: windows-latest
            browser_id: edge_win
          - os: windows-latest
            browser_id: yandex_win
          - os: windows-latest
            browser_id: firefox_win

          # macOS
          - os: macos-latest
            browser_id: chrome_mac
          - os: macos-latest
            browser_id: edge_mac
          - os: macos-latest
            browser_id: firefox_mac
          - os: macos-latest
            browser_id: webkit_mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 1. LINUX SETUP
      # ==========================================
      - name: Setup Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump curl libcap2-bin
          # Разрешаем запуск tcpdump без sudo
          sudo setcap cap_net_raw,cap_net_admin=eip $(which tcpdump)
          pip install playwright scapy

      - name: Setup Edge (Linux)
        if: matrix.browser_id == 'edge_linux'
        run: |
          curl -fSsL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor | sudo tee /usr/share/keyrings/microsoft.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update && sudo apt-get install -y microsoft-edge-stable

      - name: Setup Yandex (Linux)
        if: matrix.browser_id == 'yandex_linux'
        run: |
          curl -L -A "Mozilla/5.0" -o yandex.deb "https://browser.yandex.ru/download?os=linux&package=deb&x64=1"
          sudo apt-get install -y ./yandex.deb || sudo apt-get -f install -y

      - name: Setup Firefox (Linux)
        if: matrix.browser_id == 'firefox_linux'
        run: |
          python -m playwright install --with-deps firefox

      # ==========================================
      # 2. WINDOWS SETUP
      # ==========================================
      - name: Setup Tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pip install playwright scapy

      - name: Setup Firefox (Windows)
        if: matrix.browser_id == 'firefox_win'
        shell: powershell
        run: |
          python -m playwright install firefox

      - name: Setup Yandex (Windows)
        if: matrix.browser_id == 'yandex_win'
        shell: powershell
        run: |
          $installer = "$env:TEMP\YandexSetup.exe"
          curl.exe -L -A "Mozilla/5.0" -o $installer "https://browser.yandex.ru/download?os=win&bitness=64&banerid=6302000000"
          Start-Process -FilePath $installer -ArgumentList "--silent", "--do-not-launch-browser" -Wait

      # ==========================================
      # 3. MACOS SETUP
      # ==========================================
      - name: Setup Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          # Разрешаем непривилегированный захват BPF без sudo во избежание зомби-процессов
          sudo chmod 666 /dev/bpf*
          pip install playwright scapy

      - name: Setup Edge (macOS)
        if: matrix.browser_id == 'edge_mac'
        run: |
          brew install --cask microsoft-edge || true

      - name: Setup Playwright Browsers (macOS)
        if: matrix.browser_id == 'chrome_mac' || matrix.browser_id == 'firefox_mac' || matrix.browser_id == 'webkit_mac'
        run: |
          python -m playwright install firefox chromium webkit

      # ==========================================
      # 4. CAPTURE SCRIPT
      # ==========================================
      - name: Execute QUIC Capture Script
        env:
          TARGET_BROWSER: ${{ matrix.browser_id }}
          PYTHONUNBUFFERED: "1"
        shell: python
        run: |
          import asyncio
          import functools
          import os
          import sys
          import time
          import subprocess

          # Принудительный мгновенный вывод в консоль GitHub Actions
          print = functools.partial(print, flush=True)

          from playwright.async_api import async_playwright
          from scapy.all import rdpcap, UDP

          os_name = sys.platform
          target_browser = os.environ.get("TARGET_BROWSER")
          dump_dir = "dumps"
          tiers = {"tier1": [], "tier2": []}

          for tier_key in tiers.keys():
              filename = f"{tier_key}.txt"
              if os.path.exists(filename):
                  with open(filename, "r", encoding="utf-8") as f:
                      tiers[tier_key] = [line.strip() for line in f if line.strip() and not line.startswith("#")]
                  print(f"[*] Loaded {len(tiers[tier_key])} domains from {filename}")
              else:
                  print(f"[!] Warning: {filename} not found!")

          browsers = {}
          if os_name == "linux":
              browsers = {
                  "chrome_linux": {"type": "chromium", "path": "/usr/bin/google-chrome"},
                  "edge_linux": {"type": "chromium", "path": "/usr/bin/microsoft-edge"},
                  "yandex_linux": {"type": "chromium", "path": "/usr/bin/yandex-browser"},
                  "firefox_linux": {"type": "firefox", "path": None}
              }
          elif os_name == "win32":
              local_app = os.environ.get("LOCALAPPDATA", "")
              prog_files = os.environ.get("ProgramFiles", r"C:\Program Files")
              prog_files_x86 = os.environ.get("ProgramFiles(x86)", r"C:\Program Files (x86)")

              yandex_paths = [
                  os.path.join(local_app, "Yandex", "YandexBrowser", "Application", "browser.exe"),
                  os.path.join(prog_files_x86, "Yandex", "YandexBrowser", "Application", "browser.exe"),
                  os.path.join(prog_files, "Yandex", "YandexBrowser", "Application", "browser.exe")
              ]
              yandex_exe = next((p for p in yandex_paths if os.path.exists(p)), None)

              browsers = {
                  "chrome_win": {"type": "chromium", "path": os.path.join(prog_files, "Google", "Chrome", "Application", "chrome.exe")},
                  "edge_win": {"type": "chromium", "path": os.path.join(prog_files_x86, "Microsoft", "Edge", "Application", "msedge.exe")},
                  "yandex_win": {"type": "chromium", "path": yandex_exe},
                  "firefox_win": {"type": "firefox", "path": None}
              }
          elif os_name == "darwin":
              browsers = {
                  "chrome_mac": {"type": "chromium", "path": None},
                  "edge_mac": {"type": "chromium", "path": "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" if os.path.exists("/Applications/Microsoft Edge.app") else None},
                  "firefox_mac": {"type": "firefox", "path": None},
                  "webkit_mac": {"type": "webkit", "path": None}
              }

          if target_browser not in browsers:
              print(f"[-] Unknown browser {target_browser}")
              sys.exit(1)

          cfg = browsers[target_browser]

          # Определение дефолтного сетевого интерфейса macOS
          macos_iface = "en0"
          if os_name == "darwin":
              try:
                  route_out = subprocess.check_output("route -n get default", shell=True, text=True)
                  for line in route_out.splitlines():
                      if "interface:" in line:
                          macos_iface = line.split(":")[1].strip()
                          break
              except Exception:
                  pass
              print(f"[*] Detected macOS default interface: {macos_iface}")

          def start_sniffer(pcap_path):
              if os_name == "win32":
                  etl_path = pcap_path.replace(".pcap", ".etl")
                  subprocess.run(["pktmon", "stop"], capture_output=True)
                  subprocess.run(["pktmon", "filter", "remove"], capture_output=True)
                  subprocess.run(["pktmon", "filter", "add", "-p", "443", "-t", "UDP"], capture_output=True)
                  subprocess.run(["pktmon", "start", "-c", "--pkt-size", "0", "-f", etl_path], capture_output=True)
                  return None
              elif os_name == "darwin":
                  # Без sudo, так как права выданы на /dev/bpf*
                  return subprocess.Popen(
                      ["tcpdump", "-i", macos_iface, "-n", "-l", "-U", "-w", pcap_path, "udp port 443"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
              else:
                  # На Linux tcpdump запускается без sudo благодаря setcap
                  return subprocess.Popen(
                      ["tcpdump", "-i", "any", "-n", "-l", "-U", "-w", pcap_path, "udp port 443"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

          def stop_sniffer(proc, pcap_path):
              time.sleep(0.15)
              if os_name == "win32":
                  etl_path = pcap_path.replace(".pcap", ".etl")
                  subprocess.run(["pktmon", "stop"], capture_output=True)
                  subprocess.run(["pktmon", "etl2pcap", etl_path, "--out", pcap_path], capture_output=True)
                  if not os.path.exists(pcap_path):
                      subprocess.run(["pktmon", "pcapng", etl_path, "-o", pcap_path], capture_output=True)
              else:
                  if proc:
                      try:
                          proc.terminate()
                          proc.wait(timeout=1.0)
                      except Exception:
                          try:
                              proc.kill()
                          except Exception:
                              pass
                  # Гарантированная зачистка без спама в stderr
                  subprocess.run(["killall", "-9", "tcpdump"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)

          def extract_clean_quic_hex(pcap_path):
              if not os.path.exists(pcap_path):
                  return None
              try:
                  packets = rdpcap(pcap_path)
                  for p in packets:
                      if p.haslayer(UDP) and p[UDP].dport == 443:
                          payload = bytes(p[UDP].payload)
                          if len(payload) >= 1200 and (payload[0] & 0x80) != 0:
                              if (payload[0] & 0x30) == 0x00:
                                  return payload.hex()
              except Exception:
                  pass
              return None

          def chunk_list(lst, n):
              for i in range(0, len(lst), n):
                  yield lst[i:i + n]

          async def capture_browser(p, name, cfg):
              b_type = cfg["type"]
              b_path = cfg["path"]

              if b_path and not os.path.exists(b_path):
                  print(f"[-] Skipping {name}: binary not found at {b_path}")
                  return

              print(f"[*] Processing: {name} ({b_type})")
              pcap_file = os.path.abspath(f"{name}.pcap")
              etl_file = pcap_file.replace(".pcap", ".etl")

              for tier_key, domains in tiers.items():
                  tier_dir = os.path.join(dump_dir, tier_key)
                  os.makedirs(tier_dir, exist_ok=True)

                  if not domains:
                      continue

                  print(f"\n[*] Starting {tier_key} ({len(domains)} domains)")

                  # Обработка пачками по 300 доменов
                  for chunk_idx, chunk in enumerate(chunk_list(domains, 300), 1):
                      print(f"[*] Launching {name} for batch {chunk_idx} ({len(chunk)} domains)...")

                      launch_opts = {"headless": True}
                      if b_path:
                          launch_opts["executable_path"] = b_path

                      if b_type == "chromium":
                          quic_origins = ",".join([f"{d}:443" for d in chunk])
                          launch_opts["args"] = [
                              "--no-sandbox",
                              "--enable-quic",
                              "--quic-version=h3",
                              f"--origin-to-force-quic-on={quic_origins}"
                          ]
                          browser = await p.chromium.launch(**launch_opts)
                      elif b_type == "firefox":
                          alt_svc = ",".join([f'{d};h3=":443"' for d in chunk])
                          launch_opts["firefox_user_prefs"] = {
                              "network.http.http3.enable": True,
                              "network.http.http3.alt-svc-mapping-for-testing": alt_svc
                          }
                          browser = await p.firefox.launch(**launch_opts)
                      else:
                          browser = await p.webkit.launch(**launch_opts)

                      context = await browser.new_context(ignore_https_errors=True)

                      for d_idx, domain in enumerate(chunk, 1):
                          if os.path.exists(pcap_file):
                              try: os.remove(pcap_file)
                              except: pass
                          if os.path.exists(etl_file):
                              try: os.remove(etl_file)
                              except: pass

                          target_url = f"https://{domain}"
                          sniff_proc = start_sniffer(pcap_file)
                          time.sleep(0.1)

                          try:
                              page = await context.new_page()
                              try:
                                  await page.goto(target_url, timeout=1500)
                              except Exception:
                                  pass
                              await page.close()
                          except Exception as e:
                              print(f"[-] Page error on {domain}: {e}")
                          finally:
                              stop_sniffer(sniff_proc, pcap_file)

                          hex_data = extract_clean_quic_hex(pcap_file)
                          if hex_data:
                              filename = f"{os_name}_{name}_{domain}_initial.hex"
                              out_file = os.path.join(tier_dir, filename)
                              with open(out_file, "w", encoding="ascii") as f:
                                  f.write(hex_data)
                              print(f"[+] [{d_idx}/{len(chunk)}] SUCCESS: {domain} ({len(hex_data)//2} B) -> {filename}")
                          else:
                              print(f"[-] [{d_idx}/{len(chunk)}] No QUIC Initial on {domain}")

                      await context.close()
                      await browser.close()

          async def main():
              async with async_playwright() as p:
                  await capture_browser(p, target_browser, cfg)

          asyncio.run(main())

      # ==========================================
      # 5. ВЫГРУЗКА
      # ==========================================
      - name: Upload Clean QUIC Dumps
        uses: actions/upload-artifact@v4
        with:
          name: raw-dumps-${{ matrix.browser_id }}
          path: dumps/

  # ============================================================================
  # 6. АГРЕГАЦИЯ В 1 ОБЩИЙ АРХИВ
  # ============================================================================
  aggregate:
    name: Combine All Dumps into Single Archive
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - name: Download all browser artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-dumps-*
          path: unified_dumps
          merge-multiple: true

      - name: Upload Unified Archive
        uses: actions/upload-artifact@v4
        with:
          name: quic-clean-dumps-all
          path: unified_dumps/
